<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MCA Faculty</title>

    <style>

        .faculty {
            background-color: white;
            padding: 50px 20px;
            text-align: center;
        }

        .faculty h2 {
            color: #003366;
            margin-bottom: 30px;
        }

        .faculty-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .faculty-card {
            width: 280px;
            background-color: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        .faculty-card img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #0077cc;
        }

        .faculty-card h3 {
            color: #003366;
            margin-bottom: 10px;
        }

        .faculty-card p {
            margin: 7px 0;
            color: #555;
        }

        @media (max-width: 600px) {

            .faculty-card {
                width: 90%;
            }

        }

    </style>

</head>

<body>

    <!-- FACULTY -->

    <section id="faculty" class="faculty">

        <h2>MCA Faculty</h2>

        <div class="faculty-container">

            <!-- FACULTY 1 -->

            <div class="faculty-card">

                <img
                    src="https://mcet.ac.in/wp-content/uploads/2026/03/R-Sujitha-e1773202706872-100x150.png"
                    alt="Prof. Sujitha">

                <h3>Prof. Sujitha</h3>

                <p>Assistant Professor</p>

                <p>MCA, M.Tech</p>

                <p>Specialization: Programming</p>

            </div>


            <!-- FACULTY 2 -->

            <div class="faculty-card">

                <img
                    src="https://mcet.ac.in/wp-content/uploads/2025/03/Jeeja-G-S-1-100x150.jpg"
                    alt="Prof. Jeeja">

                <h3>Prof. Jeeja</h3>

                <p>Assistant Professor</p>

                <p>Specialization: Database</p>

            </div>


            <!-- FACULTY 3 -->

            <div class="faculty-card">

                <img
                    src="https://mcet.ac.in/wp-content/uploads/2025/01/Rekha-M-Pillai-100x150.jpg"
                    alt="Prof. Rekha Pillai">

                <h3>Prof. Rekha Pillai</h3>

                <p>Assistant Professor</p>

                <p>MCA, Ph.D.</p>

                <p>Specialization: AI &amp; ML</p>

            </div>

        </div>

    </section>

</body>

</html>
