<style>

    /* GALLERY */

    .gallery {
        background-color: #eaf2f8;
        padding: 50px 20px;
        text-align: center;
    }

    .gallery h2 {
        color: #003366;
        margin-bottom: 30px;
    }

    .gallery-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        max-width: 1100px;
        margin: auto;
    }

    .gallery-card {
        width: 300px;
        background-color: white;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 2px 10px #ccc;
        transition: 0.3s;
    }

    .gallery-card:hover {
        transform: translateY(-5px);
    }

    .gallery-card img {
        width: 100%;
        height: 190px;
        object-fit: cover;
        border-radius: 8px;
    }

    .gallery-card p {
        color: #003366;
        font-weight: bold;
        margin: 10px 0 5px;
    }

    @media (max-width: 600px) {

        .gallery-card {
            width: 90%;
        }

    }

</style>
