<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HOD - MCA Department</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        /* HOD SECTION */
        .hod {
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(135deg, #eaf4ff, #ffffff);
        }

        .hod h2 {
            color: #003366;
            font-size: 32px;
            margin-bottom: 35px;
        }

        .hod h2::after {
            content: "";
            display: block;
            width: 60px;
            height: 4px;
            background: #0077cc;
            margin: 10px auto 0;
            border-radius: 5px;
        }

        /* HOD CARD */
        .hod-card {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            border-top: 5px solid #0077cc;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        /* HOD IMAGE */
        .hod-card img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #0077cc;
            margin-bottom: 20px;
        }

        /* NAME */
        .hod-details h3 {
            color: #003366;
            font-size: 26px;
            margin-bottom: 5px;
        }

        /* DESIGNATION */
        .designation {
            color: #0077cc;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* INFORMATION */
        .hod-info {
            text-align: left;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .hod-info p {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            color: #555;
        }

        .hod-info p:last-child {
            border-bottom: none;
        }

        .hod-info strong {
            color: #003366;
        }

        .hod-info a {
            color: #0077cc;
            text-decoration: none;
        }

        .hod-info a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .hod {
                padding: 45px 15px;
            }

            .hod h2 {
                font-size: 26px;
            }

            .hod-card {
                padding: 25px 20px;
            }

            .hod-card img {
                width: 140px;
                height: 140px;
            }

            .hod-details h3 {
                font-size: 23px;
            }

            .hod-info p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- HOD SECTION -->
    <section id="hod" class="hod">

        <h2>Head of the Department</h2>

        <div class="hod-card">

            <img
                src="https://mcet.ac.in/wp-content/uploads/2024/05/hod-mca.jpg"
                alt="Dr. Sreeja K - Head of the Department">

            <div class="hod-details">

                <h3>Dr. Sreeja K</h3>

                <p class="designation">
                    Head of Department, MCA
                </p>

                <div class="hod-info">

                    <p>
                        <strong>Qualification:</strong>
                        MCA, Ph.D.
                    </p>

                    <p>
                        <strong>Experience:</strong>
                        15+ Years
                    </p>

                    <p>
                        <strong>Email:</strong>
                        <a href="mailto:hod@mohandascollege.edu.in">
                            hod@mohandascollege.edu.in
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
